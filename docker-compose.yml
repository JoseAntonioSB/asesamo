# ============================================================
# ASESAMO — Phase 1 MVP Root Docker Compose Orchestration
# File: docker-compose.yml
# Description: Fully orchestrated single-command deployment
#              supporting: docker compose up --build
# ============================================================

services:
  # ------------------------------------------------------------
  # 1. Database: PostgreSQL 16 with pgcrypto & citext extensions
  # ------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: asesamo-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-asesamo_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asesamo_secret_dev}
      POSTGRES_DB: ${DB_NAME:-asesamo_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - asesamo_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asesamo_admin} -d ${DB_NAME:-asesamo_db} -h localhost"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - asesamo-net

  # ------------------------------------------------------------
  # 2. Database Migration Runner (golang-migrate)
  # ------------------------------------------------------------
  migrate:
    image: migrate/migrate:v4.17.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - /migrate
      - -path=/migrations
      - -database=${DOCKER_DATABASE_URL:-postgres://${DB_USER:-asesamo_admin}:${DB_PASSWORD:-asesamo_secret_dev}@db:5432/${DB_NAME:-asesamo_db}?sslmode=disable}
      - -verbose
    command: ["up"]
    networks:
      - asesamo-net

  # ------------------------------------------------------------
  # 3. Database Seeder (Deterministic Dev & Test Data)
  # ------------------------------------------------------------
  seeder:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./db/seeds:/seeds:ro
    environment:
      POSTGRES_USER: ${DB_USER:-asesamo_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asesamo_secret_dev}
      POSTGRES_DB: ${DB_NAME:-asesamo_db}
    entrypoint:
      - sh
      - -c
      - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -f /seeds/000001_seed_dev_data.sql
    networks:
      - asesamo-net

  # ------------------------------------------------------------
  # 4. Backend REST API (asesamo-api - Go Clean Architecture)
  # ------------------------------------------------------------
  api:
    build:
      context: ./asesamo-api
      dockerfile: Dockerfile
    container_name: asesamo-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${DB_USER:-asesamo_admin}:${DB_PASSWORD:-asesamo_secret_dev}@db:5432/${DB_NAME:-asesamo_db}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_min_32_characters_long_12345}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://web:3000}
      STORAGE_PATH: ${STORAGE_PATH:-/app/uploads}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-mock_account}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-mock_key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-mock_secret}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-asesamo-dev}
    volumes:
      - asesamo_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - asesamo-net

  # ------------------------------------------------------------
  # 5. Frontend Web Interface (asesamo-web - Next.js 14 App Router)
  # ------------------------------------------------------------
  web:
    build:
      context: ./asesamo-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: asesamo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8080/api/v1}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/login || wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - asesamo-net

# ------------------------------------------------------------
# Named Persistent Volumes
# ------------------------------------------------------------
volumes:
  asesamo_pgdata:
    name: asesamo_pgdata
  asesamo_uploads:
    name: asesamo_uploads

# ------------------------------------------------------------
# Internal Bridge Networks
# ------------------------------------------------------------
networks:
  asesamo-net:
    name: asesamo-net
    driver: bridge
